name: Metrics

on:
  schedule:
    - cron: "0 4 */7 * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: horvathbalazsgyorgy

          base: activity, repositories, metadata

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_calendar: yes

          plugin_repositories: yes
          plugin_repositories_featured: horvathbalazsgyorgy/BMEIIT-Project-Laboratory

          config_timezone: Europe/Budapest
